name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      qdrant:
        image: qdrant/qdrant:v1.19.1
        ports:
          - 6333:6333
    env:
      # Force the deterministic answer generator: CI runs without API keys.
      RAG_LLM_MODE: deterministic
      RAG_QDRANT_TEST_URL: http://localhost:6333
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev --extra extras --locked

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy

      - name: Wait for disposable Qdrant
        run: >-
          curl --fail --silent --show-error --retry 15 --retry-connrefused
          --retry-delay 1 --max-time 3 --retry-max-time 45 http://localhost:6333/healthz

      - name: Run tests with branch coverage
        run: |
          uv run --with coverage==7.15.2 coverage run \
            --branch --source=enterprise_rag_system -m pytest -q
          uv run --with coverage==7.15.2 coverage report \
            --show-missing --skip-covered --fail-under=80
          uv run --with coverage==7.15.2 coverage json \
            -o coverage.json

      - name: Upload coverage data
        uses: actions/upload-artifact@v7
        with:
          name: coverage-data
          path: coverage.json
          if-no-files-found: error
          retention-days: 14

      - name: Check retrieval quality against the frozen baseline
        run: |
          uv run python -m enterprise_rag_system.benchmark \
            --split test \
            --baseline data/benchmarks/corporate_pt_v1/baseline-hashing-test.json \
            --output benchmark-report.json

      - name: Check BM25 and RRF quality
        run: |
          for backend in hashing tfidf; do
            uv run python -m enterprise_rag_system.benchmark \
              --split test --backend "$backend" --strategies bm25 rrf \
              --baseline "data/benchmarks/corporate_pt_v1/baseline-bm25-rrf-${backend}-test.json" \
              --output "benchmark-bm25-${backend}.json"
          done

      - name: Upload retrieval benchmark
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: retrieval-benchmark
          path: |
            benchmark-report.json
            benchmark-bm25-*.json
          if-no-files-found: warn
          retention-days: 14

      - name: Build image
        run: docker build --tag enterprise-rag-system:ci .

      # Construir não basta: o smoke sobe o container como ele roda no Render,
      # confirma que /health responde e que o processo não é root.
      - name: Smoke test image
        run: |
          docker run --detach --name rag -p 8000:8000 -e RAG_LLM_MODE=deterministic enterprise-rag-system:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health; then
              echo; echo "API respondeu na tentativa $i"
              docker exec rag id -u | grep -qv '^0$' || { echo "container roda como root"; exit 1; }
              exit 0
            fi
            sleep 1
          done
          docker logs rag
          exit 1

      - name: Smoke test persistent product
        run: |
          docker run --detach --name rag-product -p 127.0.0.1:8001:8000 \
            --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges:true \
            --mount source=rag-product-state,target=/app/state \
            -e RAG_PRODUCT_DB=/app/state/registry.sqlite3 enterprise-rag-system:ci
          uv run python scripts/smoke_product.py

      - name: Stop container
        if: always()
        run: |
          docker rm -f rag rag-product || true
          docker volume rm rag-product-state || true

  qdrant-legacy:
    # Verify existing Compose users separately from the supported server in test.
    runs-on: ubuntu-latest
    services:
      qdrant:
        image: qdrant/qdrant:v1.12.4
        ports:
          - 6333:6333
    env:
      RAG_LLM_MODE: deterministic
      RAG_QDRANT_TEST_URL: http://localhost:6333
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --extra dev --extra extras --locked
      - name: Wait for legacy Qdrant
        run: >-
          curl --fail --silent --show-error --retry 15 --retry-connrefused
          --retry-delay 1 --max-time 3 --retry-max-time 45 http://localhost:6333/healthz
      - name: Verify generation contracts on legacy Compose server
        run: uv run pytest tests/test_qdrant_generations.py -q
