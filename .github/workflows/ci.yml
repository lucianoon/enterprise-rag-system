name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Force the deterministic answer generator: CI runs without API keys.
      RAG_LLM_MODE: deterministic
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev --extra extras --locked

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy

      - name: Run tests with branch coverage
        run: |
          uv run --with coverage==7.15.2 coverage run \
            --branch --source=enterprise_rag_system -m pytest -q
          uv run --with coverage==7.15.2 coverage report \
            --show-missing --skip-covered --fail-under=80
          uv run --with coverage==7.15.2 coverage json \
            -o coverage.json

      - name: Upload coverage data
        uses: actions/upload-artifact@v7
        with:
          name: coverage-data
          path: coverage.json
          if-no-files-found: error
          retention-days: 14

      - name: Build image
        run: docker build --tag enterprise-rag-system:ci .

      # Construir não basta: o smoke sobe o container como ele roda no Render,
      # confirma que /health responde e que o processo não é root.
      - name: Smoke test image
        run: |
          docker run --detach --name rag -p 8000:8000 -e RAG_LLM_MODE=deterministic enterprise-rag-system:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health; then
              echo; echo "API respondeu na tentativa $i"
              docker exec rag id -u | grep -qv '^0$' || { echo "container roda como root"; exit 1; }
              exit 0
            fi
            sleep 1
          done
          docker logs rag
          exit 1

      - name: Stop container
        if: always()
        run: docker rm -f rag || true
