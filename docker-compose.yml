services:
  api:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      RAG_VECTOR_STORE: qdrant
      QDRANT_URL: http://qdrant:6333
      COLLECTION_NAME: enterprise_docs
      RAG_EMBEDDING_BACKEND: tfidf
    ports:
      - "8000:8000"
    depends_on:
      - qdrant

  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage

volumes:
  qdrant_storage:
